<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Rose Day 💗</title>

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(rgba(255,230,240,0.85), rgba(255,240,245,0.85)),
        url("./bg.png");
      background-size: cover;
      background-position: center;
      font-family: 'Baloo 2', cursive;
    }

    .card {
      background: white;
      padding: 40px 30px 50px;
      border-radius: 28px;
      box-shadow: 0 15px 40px rgba(255,105,180,0.25);
      text-align: center;
      max-width: 420px;
      width: 90%;
      position: relative;
      overflow: hidden;
      z-index: 2;
    }

    .title {
      font-size: 36px;
      color: #ff9ecb;
      min-height: 60px;
      margin-bottom: 15px;
    }

    .question {
      font-size: 24px;
      color: #ff6fae;
      margin-top: 10px;
      margin-bottom: 20px;
      display: none;
    }

    .buttons {
      display: none;
      gap: 16px;
      justify-content: center;
    }

    .btn {
      background: #ff9ecb;
      border: none;
      color: white;
      padding: 10px 22px;
      border-radius: 18px;
      font-size: 18px;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 6px 15px rgba(255,105,180,0.35);
      transition: transform 0.2s ease;
    }

    .btn:hover {
      transform: scale(1.08);
    }

    .btn.no {
      background: #ffc1da;
    }

    .rose {
      width: 220px;
      margin: 25px auto 10px;
      display: none;
      animation: popUp 1s ease forwards;
    }

    @keyframes popUp {
      from { opacity: 0; transform: scale(0.7); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Fireworks canvas (inside card only) */
    canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      bottom: -20px;
      font-size: 20px;
      animation: floatUp linear infinite;
      opacity: 0.7;
      color: #ff9ecb;
      z-index: 1;
    }

    @keyframes floatUp {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-110vh); opacity: 0; }
    }
  </style>
</head>
<body>

  <audio id="bgMusic" src="song.mp3" loop></audio>

  <div class="card">
    <canvas id="fireworks"></canvas>

    <div class="title" id="typing"></div>

    <svg class="rose" id="rose" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
      <rect x="96" y="120" width="8" height="140" fill="#2e8b57"/>
      <ellipse cx="70" cy="190" rx="35" ry="18" fill="#3cb371" transform="rotate(-20 70 190)"/>
      <ellipse cx="130" cy="210" rx="35" ry="18" fill="#3cb371" transform="rotate(20 130 210)"/>
      <circle cx="100" cy="90" r="38" fill="#b11226"/>
      <circle cx="80" cy="80" r="30" fill="#c9182b"/>
      <circle cx="120" cy="80" r="30" fill="#c9182b"/>
      <circle cx="100" cy="60" r="26" fill="#d81f34"/>
      <circle cx="100" cy="70" r="14" fill="#ff4d6d"/>
    </svg>

    <div class="question" id="question">
      please be my valentine :3 ?
    </div>

    <div class="buttons" id="buttons">
      <button class="btn yes">Yes 💖</button>
      <button class="btn no">No 🙈</button>
    </div>
  </div>

  <script>
    // Typing animation
    const text = "Happy Rose Day, Nuha 🌸";
    const typingEl = document.getElementById("typing");
    let i = 0;

    function typeText() {
      if (i < text.length) {
        typingEl.textContent += text.charAt(i);
        i++;
        setTimeout(typeText, 90);
      } else {
        setTimeout(showRose, 500);
      }
    }
    typeText();

    const rose = document.getElementById("rose");
    const music = document.getElementById("bgMusic");
    const question = document.getElementById("question");
    const buttons = document.getElementById("buttons");

    function showRose() {
      rose.style.display = "block";
      question.style.display = "block";
      buttons.style.display = "flex";
      music.play();
    }

    // Floating hearts
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = "💗";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = 4 + Math.random() * 3 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 7000);
    }
    setInterval(createHeart, 450);

    // Fireworks (card only)
    const canvas = document.getElementById("fireworks");
    const ctx = canvas.getContext("2d");
    const card = document.querySelector(".card");

    function resizeCanvas() {
      canvas.width = card.clientWidth;
      canvas.height = card.clientHeight;
    }
    resizeCanvas();

    function firework() {
      const particles = [];
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      for (let i = 0; i < 40; i++) {
        particles.push({
          x: cx,
          y: cy,
          vx: Math.cos(i) * Math.random() * 4,
          vy: Math.sin(i) * Math.random() * 4,
          life: 60
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.life--;
          ctx.fillStyle = "rgba(255,105,180,0.9)";
          ctx.beginPath();
          ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
          ctx.fill();
        });

        if (particles.some(p => p.life > 0)) {
          requestAnimationFrame(animate);
        }
      }
      animate();
    }

    document.querySelector(".yes").addEventListener("click", () => {
      firework();
      setTimeout(firework, 500);
      setTimeout(firework, 1000);
    });

    document.querySelector(".no").addEventListener("click", () => {
      alert("hehe okay 🙈 still sending love 💗");
    });
  </script>

</body>
</html>
